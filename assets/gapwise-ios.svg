<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">Gapwise for iOS</title>
  <desc id="desc">The Gapwise deer mark in the same frame and treatment as the Android logo, with the iOS wordmark beneath it.</desc>
  <defs>
    <linearGradient id="gapwiseBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#62B9FF"/>
      <stop offset="100%" stop-color="#3E9CF7"/>
    </linearGradient>
    <filter id="blueGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feFlood flood-color="#4EA7FE" flood-opacity="0.55" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge><feMergeNode in="softGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#4EA7FE" flood-opacity="0.32" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge><feMergeNode in="softGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="upper-left" d="M627 638 540 534c-21-19-47-32-75-49-47-29-68-77-68-132h31c2 32 13 63 34 87 6 6 12 12 20 18-3-14-3-27-1-39 2-13 6-24 12-33l25 13c-7 15-10 30-8 42 1 17 7 29 15 37 7 8 13 12 19 15l83 37Z"/>
    <path id="lower-left" d="M627 692 522 558c-18-19-40-33-59-39-15-1-31-1-48-1 0 30 11 56 36 76 17 12 35 16 74 16v120c0 8 3 14 8 20l72 100c5 7 12 10 22 10Z"/>
  </defs>

  <!-- Kept pixel-for-pixel consistent with the Android logo treatment. -->
  <g filter="url(#blueGlow)">
    <rect x="105" y="68" width="690" height="690" rx="145" fill="#05080C" stroke="url(#gapwiseBlue)" stroke-width="28"/>
  </g>
  <g fill="url(#gapwiseBlue)" filter="url(#softGlow)" transform="translate(-172.47292418772565 -179.72563176895306) scale(0.9927797833935018)">
    <use href="#upper-left"/>
    <use href="#upper-left" transform="translate(1254 0) scale(-1 1)"/>
    <use href="#lower-left"/>
    <use href="#lower-left" transform="translate(1254 0) scale(-1 1)"/>
  </g>

